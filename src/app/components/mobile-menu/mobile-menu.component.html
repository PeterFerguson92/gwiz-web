<!-- Mobile Header -->
<div class="mobile-header {{ mobileHeaderClass }} d-block d-lg-none">
  <div class="container-fluid">
    <div class="col-12">
      <div class="mobile-header-elements">
        <!-- Logo left aligned -->
        <div class="mobile-logo">
          <a routerLink="/home">
            <img
              [src]="mobileLogo"
              alt="logo"
            />
          </a>
        </div>

        <!-- Hamburger Menu -->
        <div class="mobile-nav-icon dots-menu" (click)="toggleMenu()">
          <i class="fa-solid fa-bars"></i>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Sidebar -->
<div
  class="mobile-sidebar {{ mobileSidebarClass }}"
  [ngClass]="{ 'mobile-menu-active': isMenuOpen }"
>
  <div class="logosicon-area">
    <div class="logos">
      <img [src]="mobileLogo" alt="logo" />
    </div>
    <div class="menu-close" (click)="closeMenu()">
      <i class="fa-solid fa-xmark"></i>
    </div>
  </div>

  <div class="mobile-nav mobile-nav1">
    <ul class="mobile-nav-list nav-list1">
      <!-- Regular menu items -->
      <ng-container *ngFor="let item of menuItems">
        <app-mobile-nav-item [item]="item" (itemClicked)="closeMenu()"></app-mobile-nav-item>
      </ng-container>

      <!-- Auth links -->
      <li *ngIf="isLoggedIn">
        <a routerLink="/profile" (click)="closeMenu()">My Chamber</a>
      </li>
      <li *ngIf="isLoggedIn">
        <a (click)="logout()" style="cursor: pointer">Logout</a>
      </li>
      <li *ngIf="!isLoggedIn">
        <a routerLink="/login" (click)="closeMenu()">Login</a>
      </li>
    </ul>

    <div class="allmobilesection" *ngIf="footer">
      <!-- CTA (currently commented out)
      <a routerLink="/contact-us" [class]="btnClass">
        Get Started <i class="fa-solid fa-arrow-right"></i>
      </a>
      -->

      <div class="single-footer">
        <h3>Contact Info</h3>
        <div class="footer1-contact-info">
          <div class="contact-info-single">
            <i class="fa-solid fa-phone-volume"></i>
            <a [href]="'tel:' + footer.contact.phone">
              {{ footer.contact.phone }}
            </a>
          </div>
          <div class="contact-info-single">
            <i class="fa-solid fa-envelope"></i>
            <a [href]="'mailto:' + footer.contact.email">
              {{ footer.contact.email }}
            </a>
          </div>
          <div class="contact-info-single">
            <i class="fa-solid fa-location-dot"></i>
            <a
              [href]="getGoogleMapsLink(footer.contact.address)"
              target="_blank"
              rel="noopener noreferrer"
            >
              {{ footer.contact.address }}
            </a>
          </div>
        </div>
      </div>

      <div class="single-footer">
        <h3>Social Links</h3>
        <ul class="social-links-mobile-menu">
          <li>
            <a [href]="footer.tiktok_link">
              <i class="fa-brands fa-tiktok"></i>
            </a>
          </li>
          <li>
            <a [href]="footer.instagram_link">
              <i class="fa-brands fa-instagram"></i>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>

<owl-carousel-o class="slider-header-carousel" [options]="carouselOptions">
	<ng-container *ngFor="let slide of slides">
		<ng-template carouselSlide>
			<div class="hero1-section-area">
				<img [src]="slide.image" alt="" class="header-img1" />
				<div class="container">
					<div class="row">
						<div class="col-lg-6">
							<div class="hero-heading-area heading1">
								<!-- <h5>{{ slide.title }}</h5> -->
								<h1 class="main-heading">{{ slide.title }}</h1>
								<p class="pera">
									{{ slide.subtitle }}
								</p>
								<div class="btn-area">
									<a routerLink="/services" class="header-btn1">See Our Service<i class="fa-solid fa-arrow-right"></i></a>
									<!-- <a routerLink="/contact" class="header-btn2">See Our Services <i class="fa-solid fa-arrow-right"></i></a> -->
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</ng-template>
	</ng-container>
</owl-carousel-o>

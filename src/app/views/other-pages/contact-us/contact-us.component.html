<div class="hero1-section-area about-bg-area">
  <img src="assets/img/all-images/default-contact2.jpg" alt="" class="header-img1" />
  <div class="container">
    <div class="row">
      <div class="col-lg-8 m-auto">
        <div class="hero-heading-area heading1 text-center">
          <h1>Contact Us</h1>
          <app-breadcrumb title="Contact Us" />
        </div>
      </div>
    </div>
  </div>
</div>

<div class="contact1-section-area contact-inner sp1">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-lg-6">
        <div class="contact-header-area heading2">
          <h5>Contact Us</h5>
          <h2 class="tg-element-title">{{ contact.header }}</h2>
          <p>{{ contact.description }}</p>
          <div class="space48"></div>
          <div class="row">
            <div class="col-lg-6 col-md-6">
              <div class="contact-auhtor-side">
                <div class="icons-text">
                  <div class="icons">
                    <i class="fa-solid fa-phone"></i>
                  </div>
                  <div class="text">
                    <p>Phone</p>
                    <a [href]="contact.phone">{{ contact.phone }}</a>
                  </div>
                </div>
                <div class="space48"></div>
                <div class="icons-text">
                  <div class="icons">
                    <i class="fa-solid fa-location-dot"></i>
                  </div>
                  <div class="text">
                    <p>Address</p>
                    <a>{{ contact.address }}</a>
                  </div>
                </div>
              </div>
            </div>

            <div class="col-lg-6 col-md-6">
              <div class="space48 d-md-none"></div>
              <div class="contact-auhtor-side">
                <div class="icons-text">
                  <div class="icons">
                    <i class="fa-solid fa-envelope"></i>
                  </div>
                  <div class="text">
                    <p>Email</p>
                    <a [href]="'mailto:' + contact.email">{{ contact.email }}</a>
                  </div>
                </div>
                <div class="space48"></div>
                <div class="icons-text">
                  <div class="icons">
                    <i class="fa-brands fa-instagram"></i>
                  </div>
                  <div class="text">
                    <a
                      *ngIf="contact?.social"
                      [href]="contact.social"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      Instagram
                    </a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="contact-submit-boxarea">
          <form action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" [value]="contact.access_key" />
            <div class="row">
              <div class="col-lg-6">
                <div class="input-area">
                  <p>Name (required)</p>
                  <input type="text" name="name" placeholder="Name" required />
                </div>
              </div>
              <div class="col-lg-6">
                <div class="input-area">
                  <p>Number (required)</p>
                  <input type="number" name="phone" placeholder="Phone" required />
                </div>
              </div>

              <div class="col-lg-12">
                <div class="input-area">
                  <p>Email (required)</p>
                  <input type="email" name="email" placeholder="Email" required />
                </div>
              </div>

              <div class="col-lg-12">
                <div class="input-area">
                  <p>Additional Details (Optional)</p>
                  <textarea
                    placeholder="Describe your inquiry"
                    name="details"
                    cols="30"
                    rows="10"
                    required
                  ></textarea>
                </div>
              </div>
              <div class="col-lg-12">
                <div class="input-area1">
                  <input type="checkbox" required />
                  <p>I agree with the site privacy policy</p>
                </div>
              </div>

              <div class="col-lg-12">
                <div class="input-area1">
                  <button type="submit" class="header-btn1">
                    Submit Now <i class="fa-solid fa-arrow-right"></i>
                  </button>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

	<app-faqs *ngIf="faqs" [faqs]="faqs" [faqTitle]="faqTitle" [faqDescription]="faqDescription"/>
	<app-contact *ngIf="contact" [contact]="contact" />

</section>

	<app-notification-message [showNotification]="showNotification" [message]="message"></app-notification-message>
</section>

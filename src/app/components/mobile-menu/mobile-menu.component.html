<!-- Mobile Header -->
<div class="mobile-header {{ mobileHeaderClass }} d-block d-lg-none">
	<div class="container-fluid">
		<div class="col-12">
			<div class="mobile-header-elements">
				<div class="mobile-logo">
					<a routerLink="/home"><img [src]="mobileLogo" style="width: 35%" alt="logo" /></a>
				</div>
				<div class="mobile-nav-icon dots-menu" (click)="toggleMenu()">
					<i class="fa-solid fa-bars"></i>
				</div>
			</div>
		</div>
	</div>
</div>

<!-- Sidebar -->
<div class="mobile-sidebar {{ mobileSidebarClass }}" [ngClass]="{ 'mobile-menu-active': isMenuOpen }">
	<div class="logosicon-area">
		<div class="logos">
			<img [src]="mobileLogo" alt="logo" />
		</div>
		<div class="menu-close" (click)="closeMenu()">
			<i class="fa-solid fa-xmark"></i>
		</div>
	</div>

	<div class="mobile-nav mobile-nav1">
		<ul class="mobile-nav-list nav-list1">
			<ng-container *ngFor="let item of menuItems">
				<app-mobile-nav-item [item]="item" (itemClicked)="closeMenu()"></app-mobile-nav-item>
			</ng-container>
		</ul>

		<div class="allmobilesection" *ngIf="footer">
			<!-- <a routerLink="/contact-us" [class]="btnClass">
        Get Started <i class="fa-solid fa-arrow-right"></i>
      </a> -->

			<div class="single-footer">
				<h3>Contact Info</h3>
				<div class="footer1-contact-info">
					<div class="contact-info-single">
						<i class="fa-solid fa-phone-volume"></i>
						<a [href]="'tel:' + footer.contact.phone">{{ footer.contact.phone }}</a>
					</div>
					<div class="contact-info-single">
						<i class="fa-solid fa-envelope"></i>
						<a href="mailto:info@example.com">{{ footer.contact.email }}</a>
					</div>
					<div class="contact-info-single">
						<i class="fa-solid fa-location-dot"></i>
						<span>{{ footer.contact.address }}</span>
					</div>
				</div>
			</div>

			<div class="single-footer">
				<h3>Social Links</h3>
				<ul class="social-links-mobile-menu">
					<li>
						<a [href]="footer.tiktok_link"><i class="fa-brands fa-tiktok"></i></a>
					</li>
					<li>
						<a [href]="footer.instagram_link"><i class="fa-brands fa-instagram"></i></a>
					</li>
				</ul>
			</div>
		</div>
	</div>
</div>

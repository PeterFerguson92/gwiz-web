<div class="service1-section-area sp2">
	<div class="container">
		<div class="row">
			<div class="col-lg-6 m-auto">
				<div class="service-header-area heading2 text-center">
					<h5 data-aos="fade-up" data-aos-duration="800">Our Service</h5>
					<h2 class="tg-element-title">{{ serviceTitle }}</h2>
					<p data-aos="fade-up" data-aos-duration="1000">{{ serviceDescription }}</p>
				</div>
			</div>
		</div>

		<div class="row">
			<div *ngFor="let service of services; let i = index" class="col-lg-4 col-md-6" data-aos="zoom-out" [attr.data-aos-duration]="service.duration">
				<div class="service-auhtor-boxarea">
					<div class="img1">
						<img [src]="service.image" alt="" />
					</div>
					<div class="content-area">
						<h3>0{{ i + 1 }}</h3>
						<a routerLink="/service-single">{{ service.name }}</a>
						<p>{{ service.short_description }}</p>
						<a routerLink="/service-single" class="readmore">Learn More <i class="fa-solid fa-arrow-right"></i></a>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>

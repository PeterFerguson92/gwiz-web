								</li> -->

									<a href="javascript:void(0)">Pages <i class="fa-solid fa-angle-down"></i></a>

											<a [routerLink]="item.link">{{ item.title }}</a>
										</li>
									</ul>
								</li> -->
							</ul>

							<a routerLink="/profile" [class]="btnClass">Profile<i class="fa-solid fa-arrow-right"></i></a>
						</div>
						<div class="btn-area">
							<a routerLink="/login" [class]="btnClass">Login<i class="fa-solid fa-arrow-right"></i></a>
						</div>
					</div>
				</div>
			</div>

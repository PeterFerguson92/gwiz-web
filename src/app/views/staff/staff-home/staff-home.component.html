<section class="staff-page">
  <div class="page-header">
    <div>
      <span class="staff-kicker">Staff portal</span>
      <h1>Attendance dashboard</h1>
      <p>Choose a staff flow to continue. API wiring for attendee screens comes next.</p>
    </div>
  </div>

  <div class="staff-grid">
    <a class="staff-card" [routerLink]="['/staff/events', 'demo-event', 'check-in']">
      <span class="card-label">Events</span>
      <h2>Event check-in</h2>
      <p>Open the event attendance flow for a specific event.</p>
    </a>

    <a class="staff-card" [routerLink]="['/staff/classes', 'demo-session', 'attendance']">
      <span class="card-label">Classes</span>
      <h2>Session attendance</h2>
      <p>Open the class session attendance flow for a specific session.</p>
    </a>
  </div>
</section>

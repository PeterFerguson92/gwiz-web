<header>
	<div class="header-area {{ headerClass }} header header-sticky d-none d-lg-block" stickyScroll id="header">
		<div class="container">
			<div class="row">
				<div class="col-lg-12">
					<div class="header-elements">
						<div class="site-logo">
							<a routerLink="/home">
								<img [src]="logoImg" style="width: 40%" alt="" />
							</a>
						</div>

						<div class="main-menu">
							<ul>
								<li><a routerLink="/">Home</a></li>
								<li><a routerLink="/about">About</a></li>
								<li><a routerLink="/services">Services</a></li>
								<li><a routerLink="/contact-us">Contact Us</a></li>

								<!-- 🔐 Auth links (Option 2 clean inline style) -->
								<li *ngIf="isLoggedIn"><a routerLink="/profile">Profile</a></li>
								<li *ngIf="isLoggedIn"><a (click)="logout()" style="cursor: pointer">Logout</a></li>
								<li *ngIf="!isLoggedIn"><a routerLink="/login">Login</a></li>
							</ul>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</header>

<app-mobile-menu [btnClass]="btnClass" [mobileHeaderClass]="mobileHeaderClass" [mobileLogo]="mobileLogoImg" [mobileSidebarClass]="mobileSidebarClass" />
